[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "family-robot-service"
version = "0.1.0"
description = "Local-first family companion robot service"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18", "cryptography>=44", "pillow>=11", "pypdf>=5", "pypdfium2>=4", "sherpa-onnx==1.13.8", "numpy>=2,<3", "pypinyin==0.55.0", "faster-whisper==1.2.1", "av==18.1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]
apple = ["mlx-whisper==0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
robot-service = "robot_service.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["robot_service*"]

[tool.setuptools.package-data]
robot_service = ["data/*.txt"]
